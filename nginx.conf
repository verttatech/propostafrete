server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # a raiz não expõe nada: cada proposta vive em sua própria pasta secreta
    location = / {
        return 404;
    }

    # impede que buscadores indexem qualquer proposta
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # não guardar cache: proposta atualizada aparece na hora
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---------------------------------------------------------------
    # Proteção por senha (opcional). Para ativar:
    #   1. gere o arquivo:  htpasswd -bc .htpasswd cliente SENHA
    #   2. no Dockerfile:   COPY .htpasswd /etc/nginx/.htpasswd
    #   3. descomente as duas linhas abaixo e faça o deploy de novo
    # ---------------------------------------------------------------
    # auth_basic "Proposta comercial";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
